<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Login</h1>
    <form id="form" novalidate>
      <input id="username" placeholder="Username" autocomplete="username" aria-label="Username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
      <p id="msg" class="msg" role="alert"></p>
      <button class="block" type="submit">Log In</button>
    </form>
    <p class="switch">Don't have an account? <a href="/register.html">Sign Up</a></p>
  </main>

  <script src="/app.js"></script>
  <script>
    (async () => {
      if (getToken()) {
        try {
          const me = await api("/api/me");
          location.replace(me.role === "admin" ? "/admin.html" : "/feedback.html");
        } catch (_) {
          clearSession();
        }
      }
    })();

    const msg = document.getElementById("msg");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        return setMsg(msg, "Enter your username and password.", "error");
      }

      try {
        const data = await api("/api/login", "POST", { username, password });
        saveSession(data);
        location.replace(data.role === "admin" ? "/admin.html" : "/feedback.html");
      } catch (err) {
        setMsg(msg, err.message, "error");
      }
    });
  </script>
</body>
</html>
